<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans, sans-serif); background: var(--color-background-tertiary, #f5f5f5); }

#app { max-width: 900px; margin: 0 auto; padding: 1rem; }

#header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
#header h1 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
#status-dot { width: 10px; height: 10px; border-radius: 50%; background: #888; display: inline-block; margin-right: 6px; }
#status-text { font-size: 13px; color: var(--color-text-secondary); }

#main { display: grid; grid-template-columns: 1fr 260px; gap: 12px; }

#video-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg, 12px); overflow: hidden; position: relative; }
#video-wrap { position: relative; width: 100%; aspect-ratio: 4/3; background: #111; }
video { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
canvas#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }

#hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); border-radius: 8px; padding: 8px 14px; color: #fff; }
#hud-reps { font-size: 36px; font-weight: 500; line-height: 1; }
#hud-label { font-size: 11px; color: #aaa; margin-top: 2px; }
#hud-angle { font-size: 13px; color: #7cf; margin-top: 4px; }
#hud-phase { font-size: 11px; margin-top: 2px; }

#sidebar { display: flex; flex-direction: column; gap: 12px; }

.card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg, 12px); padding: 1rem; }
.card-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.04em; }

#exercise-select { width: 100%; padding: 8px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md, 8px); background: var(--color-background-secondary); color: var(--color-text-primary); font-size: 14px; }

.stat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 0.5px solid var(--color-border-tertiary); font-size: 13px; }
.stat-row:last-child { border-bottom: none; }
.stat-label { color: var(--color-text-secondary); }
.stat-value { font-weight: 500; color: var(--color-text-primary); }

#btn-start { width: 100%; padding: 10px; background: #1a6ef5; color: #fff; border: none; border-radius: var(--border-radius-md, 8px); font-size: 14px; cursor: pointer; font-weight: 500; }
#btn-start:hover { background: #1459cc; }
#btn-reset { width: 100%; padding: 8px; background: transparent; color: var(--color-text-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md, 8px); font-size: 13px; cursor: pointer; margin-top: 6px; }
#btn-reset:hover { background: var(--color-background-secondary); }

#angle-bar-wrap { margin-top: 8px; }
#angle-bar-bg { width: 100%; height: 8px; background: var(--color-background-secondary); border-radius: 4px; overflow: hidden; }
#angle-bar { height: 100%; width: 0%; background: #1a6ef5; border-radius: 4px; transition: width 0.08s; }
.bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--color-text-secondary); margin-top: 4px; }

#log { max-height: 120px; overflow-y: auto; font-size: 12px; color: var(--color-text-secondary); }
.log-entry { padding: 3px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
.log-entry.rep { color: #22c55e; font-weight: 500; }

#voice-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-text-secondary); cursor: pointer; margin-top: 8px; }
#voice-check { width: 16px; height: 16px; cursor: pointer; }

/* Mobile fixes */
@media (max-width: 700px) {
  #app {
    width: 100%;
    max-width: 100%;
    padding: 8px;
  }

  #main {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  #video-card {
    width: 100%;
  }

  #video-wrap {
    width: 100%;
    aspect-ratio: 4 / 3;
  }

  #sidebar {
    width: 100%;
  }

  #header h1 {
    font-size: 17px;
  }

  #hud-reps {
    font-size: 30px;
  }

  #btn-start, #btn-reset, #exercise-select {
    min-height: 44px;
  }
}

#camera-error {
  display: none;
  margin-top: 8px;
  padding: 10px;
  border-radius: 8px;
  background: #fee2e2;
  color: #991b1b;
  font-size: 13px;
  line-height: 1.4;
}

</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>SmartRehab</h1>
    <div>
      <span id="status-dot"></span>
      <span id="status-text">camera off</span>
    </div>
  </div>

  <div id="main">
    <div id="video-card">
      <div id="video-wrap">
        <video id="vid" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
        <div id="hud">
          <div id="hud-reps">0</div>
          <div id="hud-label">reps</div>
          <div id="hud-angle">angle: —</div>
          <div id="hud-phase" style="color:#aaa">waiting...</div>
        </div>
      </div>
    </div>

    <div id="sidebar">
      <div class="card">
        <div class="card-title">exercise</div>
        <select id="exercise-select">
          <option value="bicep_curl">Bicep curl</option>
          <option value="squat">Squat</option>
          <option value="shoulder_raise">Shoulder raise</option>
          <option value="pushup">Push-up</option>
        </select>

        <div id="angle-bar-wrap" style="margin-top:12px;">
          <div style="font-size:12px; color:var(--color-text-secondary); margin-bottom:4px;">live joint angle</div>
          <div id="angle-bar-bg"><div id="angle-bar"></div></div>
          <div class="bar-labels"><span>0°</span><span>90°</span><span>180°</span></div>
        </div>

        <label id="voice-toggle">
          <input type="checkbox" id="voice-check" checked>
          voice coaching
        </label>

        <button id="btn-start" style="margin-top:14px;">start camera</button>
        <div id="camera-error"></div>
        <button id="btn-reset">reset reps</button>
      </div>

      <div class="card">
        <div class="card-title">session stats</div>
        <div class="stat-row"><span class="stat-label">total reps</span><span class="stat-value" id="stat-reps">0</span></div>
        <div class="stat-row"><span class="stat-label">duration</span><span class="stat-value" id="stat-time">0:00</span></div>
        <div class="stat-row"><span class="stat-label">reps/min</span><span class="stat-value" id="stat-rpm">—</span></div>
        <div class="stat-row"><span class="stat-label">pose detected</span><span class="stat-value" id="stat-pose">no</span></div>
      </div>

      <div class="card">
        <div class="card-title">activity log</div>
        <div id="log"><div class="log-entry">Session not started.</div></div>
      </div>
    </div>
  </div>
</div>

<script>
// MediaPipe Landmark Maps: Left=[11,13,15], Right=[12,14,16] etc.
const EXERCISES = {
  bicep_curl:     { name: "Bicep curl",     left: [11,13,15], right: [12,14,16], low: 60,  high: 140, desc: "elbow angle" },
  squat:          { name: "Squat",          left: [23,25,27], right: [24,26,28], low: 90,  high: 160, desc: "knee angle"  },
  shoulder_raise: { name: "Shoulder raise", left: [13,11,23], right: [14,12,24], low: 30,  high: 100, desc: "shoulder angle" },
  pushup:         { name: "Push-up",         left: [11,13,15], right: [12,14,16], low: 70,  high: 150, desc: "elbow angle" },
};

let reps = 0, atBottom = false, smoothed = null;
let started = false, startTime = null;
let lastEncourage = 0;
let voiceOn = true;
let currentAngle = 0;
let poseActive = false;

const vid = document.getElementById('vid');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');

function getExercise() { return EXERCISES[document.getElementById('exercise-select').value]; }

function speak(msg, minGap = 4000) {
  if (!voiceOn) return;
  const now = Date.now();
  if ((speak._last||{})[msg] && now - speak._last[msg] < minGap) return;
  speak._last = speak._last || {};
  speak._last[msg] = now;
  const u = new SpeechSynthesisUtterance(msg);
  u.rate = 1.0; u.volume = 0.9;
  speechSynthesis.speak(u);
}

function addLog(msg, cls='') {
  const log = document.getElementById('log');
  const d = document.createElement('div');
  d.className = 'log-entry ' + cls;
  const t = new Date(); const ts = t.getHours()+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0');
  d.textContent = ts + '  ' + msg;
  log.prepend(d);
}

// FIXED: Calculate angle using 2D (X, Y) space only to resolve the < 90° depth tracking bug
function angle2D(lm, joints) {
  const [a, b, c] = joints;
  const ax = lm[a].x - lm[b].x, ay = lm[a].y - lm[b].y;
  const cx = lm[c].x - lm[b].x, cy = lm[c].y - lm[b].y;
  
  const dot = ax*cx + ay*cy;
  const ma = Math.sqrt(ax*ax + ay*ay), mc = Math.sqrt(cx*cx + cy*cy);
  return Math.round(Math.acos(Math.max(-1, Math.min(1, dot / (ma * mc + 1e-8)))) * 180 / Math.PI);
}

function updateRep(angleDeg) {
  const ex = getExercise();
  const alpha = 0.35; // Slightly faster reaction tracking
  smoothed = smoothed === null ? angleDeg : alpha * angleDeg + (1 - alpha) * smoothed;
  currentAngle = Math.round(smoothed);

  document.getElementById('hud-angle').textContent = 'angle: ' + currentAngle + '°  (' + ex.desc + ')';
  document.getElementById('angle-bar').style.width = Math.min(100, (currentAngle / 180) * 100) + '%';

  if (!atBottom && smoothed <= ex.low) {
    atBottom = true;
    document.getElementById('hud-phase').style.color = '#f97316';
    document.getElementById('hud-phase').textContent = '▼ going down';
  }
  if (atBottom && smoothed >= ex.high) {
    atBottom = false;
    reps++;
    document.getElementById('hud-reps').textContent = reps;
    document.getElementById('hud-phase').style.color = '#22c55e';
    document.getElementById('hud-phase').textContent = '✓ rep ' + reps + '!';
    document.getElementById('stat-reps').textContent = reps;
    addLog('Rep ' + reps + ' — ' + ex.name, 'rep');
    speak('Good! Rep ' + reps, 1500);
    if (reps % 5 === 0) speak('Amazing! ' + reps + ' reps done!', 0);
    setTimeout(() => {
      if (atBottom) return;
      document.getElementById('hud-phase').style.color = '#aaa';
      document.getElementById('hud-phase').textContent = '▲ going up';
    }, 600);
  }
}

function drawSkeleton(lm, activeJoints) {
  const W = overlay.width, H = overlay.height;
  ctx.clearRect(0, 0, W, H);

  const connections = [
    [11,12],[11,23],[12,24],[23,24],
    [11,13],[13,15],[12,14],[14,16],
    [23,25],[25,27],[24,26],[26,28],
    [27,29],[28,30],[29,31],[30,32]
  ];

  ctx.strokeStyle = 'rgba(74, 222, 128, 0.4)'; ctx.lineWidth = 2;
  connections.forEach(([a,b]) => {
    if (lm[a] && lm[b] && lm[a].visibility > 0.5 && lm[b].visibility > 0.5) {
      ctx.beginPath();
      ctx.moveTo(lm[a].x * W, lm[a].y * H);
      ctx.lineTo(lm[b].x * W, lm[b].y * H);
      ctx.stroke();
    }
  });

  // Highlight the specific arm or leg actively being used for analysis
  ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(lm[activeJoints[0]].x * W, lm[activeJoints[0]].y * H);
  ctx.lineTo(lm[activeJoints[1]].x * W, lm[activeJoints[1]].y * H);
  ctx.lineTo(lm[activeJoints[2]].x * W, lm[activeJoints[2]].y * H);
  ctx.stroke();

  lm.forEach((p, i) => {
    if (p.visibility > 0.5) {
      const isKey = activeJoints.includes(i);
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, isKey ? 7 : 4, 0, 2*Math.PI);
      ctx.fillStyle = isKey ? '#f97316' : '#22c55e';
      ctx.fill();
    }
  });
}

function updateStats() {
  if (!startTime) return;
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const m = Math.floor(elapsed / 60), s = elapsed % 60;
  document.getElementById('stat-time').textContent = m + ':' + String(s).padStart(2,'0');
  const rpm = elapsed > 10 ? Math.round(reps / (elapsed / 60)) : '—';
  document.getElementById('stat-rpm').textContent = rpm;

  const now = Date.now();
  if (reps > 0 && now - lastEncourage > 12000) {
    lastEncourage = now;
    const msgs = ['Keep going!', 'You are doing great!', 'Stay strong!', 'Looking good!'];
    speak(msgs[Math.floor(Math.random()*msgs.length)], 0);
  }
}

let pose;
async function startCamera() {
  document.getElementById('btn-start').textContent = 'loading...';
  document.getElementById('btn-start').disabled = true;

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Camera API is unavailable. Open this page in Safari/Chrome over HTTPS.');
    }

    if (!window.isSecureContext && location.hostname !== 'localhost') {
      throw new Error('Camera access requires HTTPS on mobile. Upload/serve this page from an HTTPS website.');
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'user' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    vid.srcObject = stream;
    await new Promise(resolve => {
      if (vid.readyState >= 1) resolve();
      else vid.onloadedmetadata = resolve;
    });
    await vid.play();

    overlay.width = vid.videoWidth || 640;
    overlay.height = vid.videoHeight || 480;

    pose = new Pose({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });

    pose.onResults(results => {
      const lm = results.poseLandmarks;
      poseActive = !!lm;
      document.getElementById('stat-pose').textContent = lm ? 'yes' : 'no';
      document.getElementById('stat-pose').style.color = lm ? '#22c55e' : 'var(--color-text-secondary)';

      if (lm) {
        const ex = getExercise();
        
        // DYNAMIC SIDE DETECTION: Pick the side with better visibility or presence
        let chosenJoints = ex.left;
        const leftVisibility = lm[ex.left[0]].visibility + lm[ex.left[1]].visibility + lm[ex.left[2]].visibility;
        const rightVisibility = lm[ex.right[0]].visibility + lm[ex.right[1]].visibility + lm[ex.right[2]].visibility;
        
        if (rightVisibility > leftVisibility) {
          chosenJoints = ex.right;
        }

        drawSkeleton(lm, chosenJoints);

        const [a, b, c] = chosenJoints;
        if (lm[a].visibility > 0.5 && lm[b].visibility > 0.5 && lm[c].visibility > 0.5) {
          const ang = angle2D(lm, chosenJoints);
          updateRep(ang);
        }
      } else {
        ctx.clearRect(0, 0, overlay.width, overlay.height);
      }
      updateStats();
    });

    const camera = new Camera(vid, {
      onFrame: async () => { await pose.send({ image: vid }); },
      width: 640, height: 480
    });
    camera.start();

    startTime = Date.now();
    started = true;
    document.getElementById('status-dot').style.background = '#22c55e';
    document.getElementById('status-text').textContent = 'camera live';
    document.getElementById('btn-start').textContent = 'camera running';
    addLog('Session started — ' + getExercise().name);
    speak('Session started. Begin when ready.', 0);

    setInterval(() => {
      overlay.width = vid.videoWidth || overlay.width;
      overlay.height = vid.videoHeight || overlay.height;
    }, 2000);

  } catch(e) {
    console.error('Camera error:', e);

    document.getElementById('status-text').textContent = 'camera error';
    document.getElementById('btn-start').textContent = 'retry';
    document.getElementById('btn-start').disabled = false;

    const errorBox = document.getElementById('camera-error');
    let message = e && e.message ? e.message : String(e);

    if (e && e.name === 'NotAllowedError') {
      message = 'Camera permission was denied. On iPhone, allow camera access for this website in Settings > Safari > Camera, then reload the page.';
    } else if (e && e.name === 'NotFoundError') {
      message = 'No camera was found on this device.';
    } else if (e && e.name === 'NotReadableError') {
      message = 'The camera is busy or could not be opened. Close other apps using the camera and try again.';
    } else if (e && e.name === 'SecurityError') {
      message = 'The browser blocked camera access. Open this page over HTTPS.';
    }

    errorBox.textContent = 'Camera error: ' + message;
    errorBox.style.display = 'block';
    addLog('Error: ' + message);
  }
}

document.getElementById('btn-start').onclick = () => { if (!started) startCamera(); };
document.getElementById('btn-reset').onclick = () => {
  reps = 0; atBottom = false; smoothed = null; startTime = Date.now(); lastEncourage = 0;
  document.getElementById('hud-reps').textContent = '0';
  document.getElementById('hud-phase').textContent = 'waiting...';
  document.getElementById('hud-phase').style.color = '#aaa';
  document.getElementById('stat-reps').textContent = '0';
  addLog('Counter reset');
};
document.getElementById('voice-check').onchange = e => {
  voiceOn = e.target.checked;
  if (voiceOn) speak('Voice coaching on', 0);
};
document.getElementById('exercise-select').onchange = () => {
  smoothed = null; atBottom = false;
  addLog('Exercise changed to ' + getExercise().name);
  speak(getExercise().name, 0);
};
</script>




</body>
</html>
